<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodCare - Save Lives Today</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="mobile-container">
      <div class="logo-section">
        <div class="blood-drop-icon">
          <i class="fas fa-tint"></i>
        </div>
        <h1 class="hero-title">Be a hero. Donate blood.</h1>
      </div>

      <div class="tab-switcher">
        <button id="loginTab" class="tab-btn active">Login</button>
        <button id="registerTab" class="tab-btn">Register</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="input-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              id="loginEmail"
              placeholder="Enter your email"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <i class="fas fa-eye-slash toggle-password"></i>
          </div>
        </div>

        <div class="forgot-password-wrapper">
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>

        <p class="terms-text">
          By logging in, you agree to our <a href="#">Terms of Service</a> and
          <a href="#">Privacy Policy</a>.
        </p>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <div class="input-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input
              type="text"
              id="registerName"
              placeholder="Enter your full name"
              required
              autocomplete="name"
            />
          </div>
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              id="registerEmail"
              placeholder="Enter your email"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              type="password"
              id="registerPassword"
              placeholder="Create a password (min 6 characters)"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <i class="fas fa-eye-slash toggle-password"></i>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Blood Group</label>
            <select id="bloodGroup" required>
              <option value="">Select</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>

          <div class="input-group">
            <label>Age</label>
            <input
              type="number"
              id="age"
              placeholder="Age"
              min="18"
              max="65"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <div class="input-wrapper">
            <i class="fas fa-phone input-icon"></i>
            <input
              type="tel"
              id="phone"
              placeholder="Enter your phone number"
              required
              autocomplete="tel"
            />
          </div>
        </div>

        <div class="input-group">
          <label>City</label>
          <div class="input-wrapper">
            <i class="fas fa-map-marker-alt input-icon"></i>
            <input
              type="text"
              id="city"
              placeholder="Enter your city"
              required
              autocomplete="address-level2"
            />
          </div>
        </div>

        <button type="submit" class="btn-primary">Create Account</button>

        <p class="terms-text">
          By creating an account, you agree to our
          <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>
      </form>
    </div>

    <div id="toast" class="toast hidden">
      <i class="fas fa-check-circle"></i>
      <span id="toastMessage"></span>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="spinner"></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
